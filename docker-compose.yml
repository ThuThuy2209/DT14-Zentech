# docker-compose.yml
# Dùng khi build production: chạy toàn bộ hệ thống bằng Docker
#
# --- Nếu đã có data (đã dev bằng docker-compose.dev.yml) ---
# Build & chạy      : docker compose up --build -d
# Chạy lại          : docker compose up -d
# Tắt toàn bộ       : docker compose down
# Xem log           : docker compose logs -f
#
# --- Nếu chưa có data (máy mới / reset) ---
# 1. Build & chạy   : docker compose up --build -d
# 2. Apply schema   : docker compose exec backend npx prisma migrate deploy
# 3. Sinh data mẫu  : docker compose exec backend npm run db:seed

name: opc-smartoffice

# Khuôn mẫu dùng chung cho các service
x-common: &common
  restart: unless-stopped
  networks:
    - opc_network

services:
  # --- POSTGRESQL ---
  postgres:
    <<: *common
    image: postgres:16.10-alpine
    container_name: opc_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- BACKEND (NestJS) ---
  backend:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opc_backend
    environment:
      NODE_ENV: production
      PORT: 8080
      AI_SERVICE_URL: http://ai_service:5000
      DATABASE_URL: "postgresql://${DATABASE_USER:?Set DATABASE_USER}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:?Set DATABASE_NAME}?schema=public"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
      - ai_service
    env_file:
      - ./backend/.env

  # --- FRONTEND (React / Vite) ---
  frontend:
    <<: *common
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opc_frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

  # --- AI SERVICE (FastAPI / OCR) ---
  ai_service:
    <<: *common
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: opc_ai_service
    environment:
      PORT: 5000
    env_file:
      - ./ai_service/.env
    ports:
      - "127.0.0.1:5000:5000"

networks:
  opc_network:
    driver: bridge
    name: opc_smartoffice_network

volumes:
  pgdata:
    driver: local
    name: opc_postgres_data
